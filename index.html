<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#f66b32"/><meta name="description" content="Cùng TIPY STEM luyện bàn phím qua trò chơi Chữ rơi. Chơi trên máy tính, máy tính bảng và điện thoại."/><title>TIPY STEM · Vườn phím nhỏ</title><style>.tipy-loading{display:flex;min-height:160px;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:28px;color:#75432c;background:#fff9ef;border-radius:20px}.tipy-loading p{margin:0;font-size:14px}.loading-fullscreen{position:fixed;inset:0;z-index:200;border-radius:0}.loading-letters{display:flex;align-items:center;min-height:60px;font-size:clamp(26px,6vw,48px);font-weight:850;color:#ed6631;gap:2px}.loading-letters span{display:inline-block;animation:tipy-grow 1.7s ease-in-out infinite;animation-delay:calc(var(--letter)*.1s)}@keyframes tipy-grow{0%,70%,100%{transform:scale(.55);opacity:.4}35%{transform:scale(1.15);opacity:1}}@media(prefers-reduced-motion:reduce){.loading-letters span{animation:none;transform:none;opacity:1}}
/* Bounce rhythm inspired by mobinkakei / Uiverse. See THIRD_PARTY_NOTICES.md. */
.loading-letters{gap:clamp(3px,1vw,7px);min-height:94px;font-size:clamp(17px,4vw,27px);font-family:inherit;isolation:isolate}.loading-letters span{animation:none;opacity:1}.loading-letters .loading-key{position:relative;display:grid;place-items:center;width:clamp(22px,5.4vw,42px);height:clamp(28px,6.5vw,46px);border-radius:25%;background:#ffc86b;color:#a5681c;font-weight:900;box-shadow:0 5px 0 #e6ab4b;transform:rotate(-12deg);animation:tipy-key-hop 1.15s cubic-bezier(.45,0,.55,1) infinite;animation-delay:calc(var(--letter)*.095s)}.loading-key::after{content:'';position:absolute;z-index:-1;width:70%;height:5px;border-radius:50%;background:#a8793b30;bottom:-15px;filter:blur(2px);animation:tipy-key-shadow 1.15s ease-in-out infinite;animation-delay:inherit}.loading-space{width:9px}@keyframes tipy-key-hop{0%,100%{transform:translateY(10px) rotate(-12deg) scale(1.06,.93)}45%{transform:translateY(-20px) rotate(7deg) scale(.98,1.02)}}@keyframes tipy-key-shadow{0%,100%{transform:translateY(0) scaleX(1);opacity:.65}45%{transform:translateY(30px) scaleX(.45);opacity:.25}}</style></head><body><div id="root"><div class="tipy-loading loading-fullscreen" role="status" aria-label="Đang mở trò chơi"><div class="loading-letters" aria-hidden="true"><span class="loading-key" style="--letter:0">t</span><span class="loading-key" style="--letter:1">y</span><span class="loading-key" style="--letter:2">p</span><span class="loading-key" style="--letter:3">i</span><span class="loading-key" style="--letter:4">n</span><span class="loading-key" style="--letter:5">g</span><span class="loading-space" style="--letter:6">&nbsp;</span><span class="loading-key" style="--letter:7">T</span><span class="loading-key" style="--letter:8">I</span><span class="loading-key" style="--letter:9">P</span><span class="loading-key" style="--letter:10">Y</span></div><p>Đang mở vườn phím…</p></div></div><script type="module" src="/src/main.jsx"></script></body></html>
