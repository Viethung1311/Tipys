<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#f66b32"/><meta name="description" content="Cùng TIPY STEM luyện bàn phím qua trò chơi Chữ rơi. Chơi trên máy tính, máy tính bảng và điện thoại."/><title>TIPY STEM · Vườn phím nhỏ</title><style>.tipy-loading{display:flex;min-height:160px;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:28px;color:#75432c;background:#fff9ef;border-radius:20px}.tipy-loading p{margin:0;font-size:14px}.loading-fullscreen{position:fixed;inset:0;z-index:200;border-radius:0}.loading-letters{display:flex;align-items:center;min-height:60px;font-size:clamp(26px,6vw,48px);font-weight:850;color:#ed6631;gap:2px}.loading-letters span{display:inline-block;animation:tipy-grow 1.7s ease-in-out infinite;animation-delay:calc(var(--letter)*.1s)}@keyframes tipy-grow{0%,70%,100%{transform:scale(.55);opacity:.4}35%{transform:scale(1.15);opacity:1}}@media(prefers-reduced-motion:reduce){.loading-letters span{animation:none;transform:none;opacity:1}}</style></head><body><div id="root"><div class="tipy-loading loading-fullscreen" role="status" aria-label="Đang mở trò chơi"><div class="loading-letters" aria-hidden="true"><span style="--letter:0">t</span><span style="--letter:1">y</span><span style="--letter:2">p</span><span style="--letter:3">i</span><span style="--letter:4">n</span><span style="--letter:5">g</span><span style="--letter:6">&nbsp;</span><span style="--letter:7">T</span><span style="--letter:8">I</span><span style="--letter:9">P</span><span style="--letter:10">Y</span></div><p>Đang mở vườn phím…</p></div></div><script type="module" src="/src/main.jsx"></script></body></html>
